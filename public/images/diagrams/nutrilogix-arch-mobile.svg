<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 748" role="img" aria-label="Nutrilogix AI system architecture diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4bffa5" opacity="0.75"/>
    </marker>
    <filter id="glowSm">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#4bffa5" flood-opacity="0.18"/>
    </filter>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#4bffa5" flood-opacity="0.25"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(75,255,165,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="320" height="748" rx="16" fill="#0d0c14"/>
  <rect width="320" height="748" rx="16" fill="url(#grid)"/>
  <text x="160" y="28" text-anchor="middle" fill="#ffffff" fill-opacity="0.82" font-size="14" font-weight="600">Nutrilogix AI — System Architecture</text>

  <text x="160" y="52" text-anchor="middle" fill="#4bffa5" fill-opacity="0.5" font-size="9.5" font-weight="700" letter-spacing="0.12em">VISION PIPELINE</text>
  <rect x="20" y="62" width="280" height="54" rx="9" fill="#ffffff" fill-opacity="0.04" stroke="#4bffa5" stroke-opacity="0.28" stroke-width="1.2"/>
  <text x="160" y="84" text-anchor="middle" fill="#ffffff" fill-opacity="0.88" font-size="13" font-weight="600">Camera / Photo</text>
  <text x="160" y="102" text-anchor="middle" fill="#ffffff" fill-opacity="0.42" font-size="11">RN Image Picker · Expo Camera</text>
  <line x1="160" y1="116" x2="160" y2="136" stroke="#4bffa5" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="20" y="140" width="280" height="58" rx="9" fill="#4bffa5" fill-opacity="0.07" stroke="#4bffa5" stroke-opacity="0.6" stroke-width="1.5" filter="url(#glowSm)"/>
  <text x="160" y="164" text-anchor="middle" fill="#4bffa5" font-size="13" font-weight="700">OpenAI GPT-4o Vision</text>
  <text x="160" y="183" text-anchor="middle" fill="#ffffff" fill-opacity="0.42" font-size="11">food ID · portion estimate</text>
  <line x1="160" y1="198" x2="160" y2="218" stroke="#4bffa5" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="20" y="222" width="280" height="54" rx="9" fill="#ffffff" fill-opacity="0.04" stroke="#4bffa5" stroke-opacity="0.28" stroke-width="1.2"/>
  <text x="160" y="244" text-anchor="middle" fill="#ffffff" fill-opacity="0.88" font-size="13" font-weight="600">Macro Parser</text>
  <text x="160" y="262" text-anchor="middle" fill="#ffffff" fill-opacity="0.42" font-size="11">calories · protein · carbs · fat</text>

  <text x="160" y="304" text-anchor="middle" fill="#4bffa5" fill-opacity="0.5" font-size="9.5" font-weight="700" letter-spacing="0.12em">BARCODE PIPELINE</text>
  <rect x="20" y="314" width="280" height="54" rx="9" fill="#ffffff" fill-opacity="0.04" stroke="#4bffa5" stroke-opacity="0.28" stroke-width="1.2"/>
  <text x="160" y="336" text-anchor="middle" fill="#ffffff" fill-opacity="0.88" font-size="13" font-weight="600">Barcode Scanner</text>
  <text x="160" y="354" text-anchor="middle" fill="#ffffff" fill-opacity="0.42" font-size="11">Expo BarCodeScanner</text>
  <line x1="160" y1="368" x2="160" y2="388" stroke="#4bffa5" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="20" y="392" width="280" height="54" rx="9" fill="#ffffff" fill-opacity="0.04" stroke="#4bffa5" stroke-opacity="0.28" stroke-width="1.2"/>
  <text x="160" y="414" text-anchor="middle" fill="#ffffff" fill-opacity="0.88" font-size="13" font-weight="600">Product Database</text>
  <text x="160" y="432" text-anchor="middle" fill="#ffffff" fill-opacity="0.42" font-size="11">UPC · Open Food Facts API</text>
  <line x1="160" y1="446" x2="160" y2="466" stroke="#4bffa5" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="20" y="470" width="280" height="54" rx="9" fill="#ffffff" fill-opacity="0.04" stroke="#4bffa5" stroke-opacity="0.28" stroke-width="1.2"/>
  <text x="160" y="492" text-anchor="middle" fill="#ffffff" fill-opacity="0.88" font-size="13" font-weight="600">Health Score Engine</text>
  <text x="160" y="510" text-anchor="middle" fill="#ffffff" fill-opacity="0.42" font-size="11">localized nutrient scoring</text>
  <line x1="160" y1="524" x2="160" y2="548" stroke="#4bffa5" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="20" y="552" width="280" height="72" rx="9" fill="#4bffa5" fill-opacity="0.06" stroke="#4bffa5" stroke-opacity="0.5" stroke-width="1.5" filter="url(#glow)"/>
  <text x="160" y="576" text-anchor="middle" fill="#ffffff" fill-opacity="0.9" font-size="13" font-weight="700">Supabase</text>
  <text x="160" y="594" text-anchor="middle" fill="#ffffff" fill-opacity="0.42" font-size="11">Postgres · Row-Level Security</text>
  <text x="160" y="610" text-anchor="middle" fill="#ffffff" fill-opacity="0.42" font-size="11">Auth (JWT) · Storage Buckets</text>
  <line x1="160" y1="624" x2="160" y2="648" stroke="#4bffa5" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="28" y="652" width="264" height="54" rx="9" fill="#ffffff" fill-opacity="0.04" stroke="#4bffa5" stroke-opacity="0.28" stroke-width="1.2"/>
  <text x="160" y="674" text-anchor="middle" fill="#ffffff" fill-opacity="0.88" font-size="13" font-weight="600">Apple Health / HealthKit</text>
  <text x="160" y="692" text-anchor="middle" fill="#ffffff" fill-opacity="0.42" font-size="11">activity · calorie burn · steps</text>
</svg>
