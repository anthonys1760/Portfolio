name: Weekly Blog Post

on:
  schedule:
    # Mondays at 14:00 UTC, about 9:00 AM Eastern.
    - cron: '0 14 * * 1'
  workflow_dispatch:

# One draft at a time. A second run waits instead of racing the same posts.json.
concurrency:
  group: weekly-blog
  cancel-in-progress: false

jobs:
  generate-post:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate blog post
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! grep -q "api.x.ai/v1" scripts/generate-blog-post.mjs; then
            echo "gh-pages does not have the Grok writer yet. Merge that pull request before this workflow runs."
            {
              echo "## Weekly blog draft did not run"
              echo
              echo "The generator on gh-pages is still the previous script. Merge the gh-pages writer pull request first."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node scripts/generate-blog-post.mjs

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Anthony Smith Blog Bot"
          git config user.email "anthony.smith1760@gmail.com"
          git add blog/posts/ blog/data/posts.json sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          if [[ ! -f /tmp/blog-run.json ]]; then
            echo "Generator did not write /tmp/blog-run.json"
            exit 1
          fi

          # Slug and date are script-generated and safe to interpolate.
          # Title and topic text are model output, so Python writes them
          # into argv and the body file without a second shell expansion.
          slug=$(jq -r '.slug' /tmp/blog-run.json)
          date=$(jq -r '.dateISO' /tmp/blog-run.json)
          if [[ ! "$slug" =~ ^[a-z0-9-]+$ || ! "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Refusing to open a pull request with an unexpected slug or date"
            exit 1
          fi
          branch="blog/${date}-${slug}"
          export BLOG_BRANCH="$branch"

          git checkout -b "$branch"
          git commit -m "content(blog): draft ${slug}"
          # Push only the draft branch. Never push gh-pages from this job.
          git push origin "HEAD:refs/heads/${branch}"

          python3 - << 'PY'
          import json, os, subprocess
          meta = json.load(open("/tmp/blog-run.json"))
          branch = os.environ["BLOG_BRANCH"]
          body = "\n".join([
              "Draft weekly post for review. Merging publishes it on https://anthonysdigital.net.",
              "",
              f"- Topic: {meta['topicLabel']}",
              f"- topicKey: {meta['topicKey']}",
              f"- Format: {meta['formatLabel']}",
              f"- format: {meta['format']}",
              f"- Title: {meta['title']}",
              f"- Slug: {meta['slug']}",
              f"- Date: {meta['dateISO']}",
              "",
          ])
          open("/tmp/blog-pr-body.md", "w").write(body)
          subprocess.run([
              "gh", "pr", "create",
              "--repo", os.environ["GITHUB_REPOSITORY"],
              "--base", "gh-pages",
              "--head", branch,
              "--title", f"Blog draft: {meta['title']}",
              "--body-file", "/tmp/blog-pr-body.md",
          ], check=True)
          PY
