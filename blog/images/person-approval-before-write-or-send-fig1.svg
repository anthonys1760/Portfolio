<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img"><title>A state-changing call waits for a person</title><desc>Sequence diagram. The model proposes a send_email call to the application. The application classifies it as state-changing and holds it. It shows the person the tool and exact arguments. The person approves, creating a record bound to the argument hash. The application checks the tool and hash match, then executes the call once in the tool runner.</desc><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4bffa5"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7a90"/></marker></defs><rect width="1000" height="690" rx="24" fill="#14111f"/><rect x="48" y="40" width="40" height="5" rx="2.5" fill="#4bffa5"/><text x="48" y="78" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">A state-changing call waits for a person</text><line x1="161" y1="166" x2="161" y2="660" stroke="#3b3652" stroke-width="2" stroke-dasharray="6 8"/><rect x="58" y="110" width="206" height="56" rx="12" fill="#1d1a2b" stroke="#3b3652" stroke-width="2"/><text x="161" y="138.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Model</text><line x1="387" y1="166" x2="387" y2="660" stroke="#3b3652" stroke-width="2" stroke-dasharray="6 8"/><rect x="284" y="110" width="206" height="56" rx="12" fill="#1d1a2b" stroke="#3b3652" stroke-width="2"/><text x="387" y="138.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Application</text><line x1="613" y1="166" x2="613" y2="660" stroke="#3b3652" stroke-width="2" stroke-dasharray="6 8"/><rect x="510" y="110" width="206" height="56" rx="12" fill="#1d1a2b" stroke="#3b3652" stroke-width="2"/><text x="613" y="138.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Person</text><line x1="839" y1="166" x2="839" y2="660" stroke="#3b3652" stroke-width="2" stroke-dasharray="6 8"/><rect x="736" y="110" width="206" height="56" rx="12" fill="#1d1a2b" stroke="#3b3652" stroke-width="2"/><text x="839" y="138.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Tool runner</text><line x1="167" y1="234" x2="379" y2="234" stroke="#4bffa5" stroke-width="3" marker-end="url(#am)"/><text x="274" y="212.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#d9d6e6" text-anchor="middle" dominant-baseline="middle">proposes send_email(to, body)</text><rect x="210.8" y="272" width="352.5" height="48" rx="10" fill="rgba(75,255,165,0.12)" stroke="#4bffa5" stroke-width="2"/><text x="387" y="296.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">state-changing: hold proposal</text><line x1="393" y1="382" x2="605" y2="382" stroke="#4bffa5" stroke-width="3" marker-end="url(#am)"/><text x="500" y="360.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#d9d6e6" text-anchor="middle" dominant-baseline="middle">shows tool + exact arguments</text><line x1="607" y1="456" x2="395" y2="456" stroke="#4bffa5" stroke-width="3" marker-end="url(#am)"/><text x="500" y="434.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#d9d6e6" text-anchor="middle" dominant-baseline="middle">approves: record bound to args</text><rect x="216.0" y="494" width="342.0" height="48" rx="10" fill="rgba(75,255,165,0.12)" stroke="#4bffa5" stroke-width="2"/><text x="387" y="518.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">tool and argument hash match</text><line x1="393" y1="604" x2="831" y2="604" stroke="#4bffa5" stroke-width="3" marker-end="url(#am)"/><text x="613" y="582.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#d9d6e6" text-anchor="middle" dominant-baseline="middle">executes the call once</text></svg>
