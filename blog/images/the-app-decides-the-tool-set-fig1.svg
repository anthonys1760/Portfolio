<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="496" viewBox="0 0 1000 496" role="img"><title>Three bounds the application owns</title><desc>Flow diagram. The actor and task feed a catalog of which tools exist for this call, then a schema check on the arguments, then a write check, and only then does the handler run. An unknown name or invalid arguments are refused at the schema check.</desc><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4bffa5"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7a90"/></marker></defs><rect width="1000" height="496" rx="24" fill="#14111f"/><rect x="48" y="40" width="40" height="5" rx="2.5" fill="#4bffa5"/><text x="48" y="78" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Three bounds the application owns</text><rect x="48.0" y="128" width="148.8" height="170" rx="14" fill="#1d1a2b" stroke="#3b3652" stroke-width="2"/><text x="122.4" y="176.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Actor + task</text><text x="122.4" y="233.6" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">who is asking,</text><text x="122.4" y="254.4" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">for what</text><line x1="200.8" y1="213" x2="230.8" y2="213" stroke="#4bffa5" stroke-width="3" marker-end="url(#am)"/><rect x="236.8" y="128" width="148.8" height="170" rx="14" fill="#1d1a2b" stroke="#3b3652" stroke-width="2"/><text x="311.20000000000005" y="176.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Catalog</text><text x="311.20000000000005" y="233.6" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">which tools</text><text x="311.20000000000005" y="254.4" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">exist</text><line x1="389.6" y1="213" x2="419.6" y2="213" stroke="#4bffa5" stroke-width="3" marker-end="url(#am)"/><rect x="425.6" y="128" width="148.8" height="170" rx="14" fill="rgba(75,255,165,0.12)" stroke="#4bffa5" stroke-width="3"/><text x="439.6" y="116" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#4bffa5">CHECK</text><text x="500" y="176.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Schema</text><text x="500" y="233.6" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">which arguments</text><text x="500" y="254.4" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">pass</text><line x1="578.4" y1="213" x2="608.4" y2="213" stroke="#4bffa5" stroke-width="3" marker-end="url(#am)"/><rect x="614.4" y="128" width="148.8" height="170" rx="14" fill="#1d1a2b" stroke="#3b3652" stroke-width="2"/><text x="688.8000000000001" y="176.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Write check</text><text x="688.8000000000001" y="233.6" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">registered for a</text><text x="688.8000000000001" y="254.4" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">write?</text><line x1="767.2" y1="213" x2="797.2" y2="213" stroke="#4bffa5" stroke-width="3" marker-end="url(#am)"/><rect x="803.2" y="128" width="148.8" height="170" rx="14" fill="#1d1a2b" stroke="#3b3652" stroke-width="2"/><text x="877.6" y="176.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Handler runs</text><text x="877.6" y="233.6" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">only after all</text><text x="877.6" y="254.4" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">three</text><line x1="500.0" y1="302" x2="500.0" y2="364" stroke="#ff7a90" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ac)"/><rect x="270.5" y="370" width="459" height="56" rx="12" fill="rgba(255,122,144,0.12)" stroke="#ff7a90" stroke-width="2"/><text x="500" y="398.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Unknown name or bad arguments: refused</text></svg>
