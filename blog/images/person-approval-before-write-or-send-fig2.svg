<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="496" viewBox="0 0 1000 496" role="img"><title>An approval covers one exact call</title><desc>Flow diagram. A person approves one proposal. The application stores a record of the tool name and argument hash. Later the call changes, for example a new recipient. The executor compares the hash, and on a mismatch it refuses and asks for a new approval.</desc><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4bffa5"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7a90"/></marker></defs><rect width="1000" height="496" rx="24" fill="#14111f"/><rect x="48" y="40" width="40" height="5" rx="2.5" fill="#4bffa5"/><text x="48" y="78" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">An approval covers one exact call</text><rect x="48.0" y="128" width="196.0" height="170" rx="14" fill="#1d1a2b" stroke="#3b3652" stroke-width="2"/><text x="146" y="176.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Person approves</text><text x="146" y="233.6" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">one proposal, as</text><text x="146" y="254.4" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">shown</text><line x1="248.0" y1="213" x2="278.0" y2="213" stroke="#4bffa5" stroke-width="3" marker-end="url(#am)"/><rect x="284.0" y="128" width="196.0" height="170" rx="14" fill="#1d1a2b" stroke="#3b3652" stroke-width="2"/><text x="382" y="176.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Approval record</text><text x="382" y="233.6" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">tool name + argument</text><text x="382" y="254.4" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">hash</text><line x1="484.0" y1="213" x2="514.0" y2="213" stroke="#4bffa5" stroke-width="3" marker-end="url(#am)"/><rect x="520.0" y="128" width="196.0" height="170" rx="14" fill="#1d1a2b" stroke="#3b3652" stroke-width="2"/><text x="618" y="176.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Call changes</text><text x="618" y="233.6" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">new recipient or</text><text x="618" y="254.4" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">amount</text><line x1="720.0" y1="213" x2="750.0" y2="213" stroke="#4bffa5" stroke-width="3" marker-end="url(#am)"/><rect x="756.0" y="128" width="196.0" height="170" rx="14" fill="rgba(75,255,165,0.12)" stroke="#4bffa5" stroke-width="3"/><text x="770.0" y="116" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#4bffa5">CHECK</text><text x="854" y="176.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Executor compares</text><text x="854" y="233.6" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">hash of the call it</text><text x="854" y="254.4" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#9a96b0" text-anchor="middle" dominant-baseline="middle">got</text><line x1="854.0" y1="302" x2="854.0" y2="364" stroke="#ff7a90" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ac)"/><rect x="472.0" y="370" width="480" height="56" rx="12" fill="rgba(255,122,144,0.12)" stroke="#ff7a90" stroke-width="2"/><text x="712" y="398.0" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Mismatch: refuse, ask for a new approval</text></svg>
